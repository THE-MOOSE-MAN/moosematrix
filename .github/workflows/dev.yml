name: Deploy Moosematrix (Dev)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moosematrix
  SERVICE_NAME: moosematrix-app-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A newer push may cancel an older build...
    concurrency:
      group: moosematrix-dev-build
      cancel-in-progress: true
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build year (UTC)
        shell: bash
        run: |
          set -euo pipefail
          echo "MOOSE_BUILD_YEAR=$(date -u +%Y)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name (lowercase)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE=$IMAGE"

      - name: Log in to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:dev-latest
            ${{ steps.meta.outputs.image }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          build-args: |
            MOOSE_BUILD_YEAR=${{ env.MOOSE_BUILD_YEAR }}
          provenance: false
          sbom: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # ...but never a running deploy: deploys queue (the VPS side also takes /run/lock/moose-deploy.lock).
    concurrency:
      group: moosematrix-dev-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/deploy-safe.sh
          sparse-checkout-cone-mode: false

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pin VPS host key (VPS_KNOWN_HOSTS secret)
        shell: bash
        run: |
          set -euo pipefail
          # The host key is pinned from a repo secret instead of trusting whatever ssh-keyscan returns on
          # each run (same pattern as moose_money / mooseman-site). Pre-merge step: add VPS_KNOWN_HOSTS.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          grep -q '[^[:space:]]' ~/.ssh/known_hosts \
            || { echo "::error::VPS_KNOWN_HOSTS secret is missing or empty; see docs/deploy-safety.md"; exit 1; }

      - name: Deploy Moosematrix Dev (ephemeral GHCR login on VPS)
        shell: bash
        run: |
          set -euo pipefail

          # scripts/deploy-safe.sh (rollback tag, verify, auto-rollback, deploy record) is streamed
          # ahead of the remote script over the same SSH session; nothing is installed on the VPS.
          { cat scripts/deploy-safe.sh; cat <<'EOF'
          set -euo pipefail
          # Whole body in main() and run with stdin from /dev/null: bash reads the entire stream before
          # anything runs, so no child process (docker compose run/exec) can swallow the rest (VB R39 H1).
          main() {
          ds_lock   # host-wide deploy lock: one deploy at a time on the VPS (VB R39 M1)

          SERVICE_NAME="moosematrix-app-dev"
          IMAGE_REPO="${{ needs.build-and-push.outputs.image }}"
          GHCR_USER="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"
          GHCR_TOKEN="${{ github.token }}"

          export DS_APP="moosematrix-dev" DS_CONTAINER="$SERVICE_NAME" DS_SERVICE="$SERVICE_NAME"
          export DS_SHA="${{ github.sha }}" DS_RUN_ID="${{ github.run_id }}"

          # Use a temporary docker config so nothing is written to ~/.docker
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'ds_on_exit || true; rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null

          cd /home/moose/projects/infra

          echo "🏷️ Tagging the running image for rollback..."
          ds_pre

          echo "📥 Pulling latest dev image for $SERVICE_NAME..."
          docker compose -f docker-compose.yml pull "$SERVICE_NAME"

          echo "🚀 Recreating container..."
          docker compose -f docker-compose.yml up -d --force-recreate "$SERVICE_NAME"

          echo "🩺 Waiting for health + revision == ${DS_SHA:0:7} (auto-rollback on failure)..."
          ds_finish

          echo "🔎 Running container:"
          docker ps --filter "name=$SERVICE_NAME" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

          echo "🧹 Pruning dangling images only (keeps tagged and rollback-* images)..."
          ds_prune

          echo "✅ Dev container updated (no public dev subdomain)."
          echo "   View via SSH port-forward (example):"
          echo "   ssh -p <VPS_PORT> -L 3001:127.0.0.1:3001 <VPS_USER>@<VPS_HOST>"
          }
          main </dev/null; exit $?
          EOF
          } | ssh -4 -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s
