name: Deploy Moosematrix (Dev)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: moosematrix-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moosematrix
  SERVICE_NAME: moosematrix-app-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build year (UTC)
        shell: bash
        run: |
          set -euo pipefail
          echo "MOOSE_BUILD_YEAR=$(date -u +%Y)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name (lowercase)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE=$IMAGE"

      - name: Log in to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:dev-latest
            ${{ steps.meta.outputs.image }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          build-args: |
            MOOSE_BUILD_YEAR=${{ env.MOOSE_BUILD_YEAR }}
          provenance: false
          sbom: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Join the tailnet as an ephemeral tag:ci node (OAuth client limited to auth_keys + tag:ci).
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.104.2
          use-cache: "true"

      - name: Pin VPS host key (VPS_KNOWN_HOSTS secret)
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Host key pinned from the secret (same pattern as the main-branch workflows); ssh looks it up
          # under the fixed alias moose-vps (-o HostKeyAlias=moose-vps) with strict checking.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts.in
          awk 'NF == 0 || $1 ~ /^#/ { next }
               $1 ~ /^(\||@)/ || NF < 3 { bad = 1; next }
               { print "moose-vps", $2, $3; n++ }
               END { exit (bad || n == 0) }' ~/.ssh/known_hosts.in > ~/.ssh/known_hosts \
            || { rm -f ~/.ssh/known_hosts ~/.ssh/known_hosts.in; echo "::error::VPS_KNOWN_HOSTS secret is missing, empty or malformed"; exit 1; }
          rm -f ~/.ssh/known_hosts.in

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy Moosematrix Dev (ephemeral GHCR login on VPS)
        shell: bash
        run: |
          set -euo pipefail

          ssh -T -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o HostKeyAlias=moose-vps \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_TS_HOST }}" <<'EOF'
          set -euo pipefail

          SERVICE_NAME="moosematrix-app-dev"
          IMAGE_REPO="${{ needs.build-and-push.outputs.image }}"
          GHCR_USER="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"
          GHCR_TOKEN="${{ github.token }}"

          # Use a temporary docker config so nothing is written to ~/.docker
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null

          cd /home/moose/projects/infra

          echo "📥 Pulling latest dev image for $SERVICE_NAME..."
          docker compose -f docker-compose.yml pull "$SERVICE_NAME"

          echo "🚀 Recreating container..."
          docker compose -f docker-compose.yml up -d --force-recreate "$SERVICE_NAME"

          echo "🔎 Running container:"
          docker ps --filter "name=$SERVICE_NAME" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

          echo "🔎 Image revision label (dev-latest):"
          docker image inspect "${IMAGE_REPO}:dev-latest" \
            --format 'revision={{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true

          echo "🧹 Pruning images older than 7 days..."
          docker image prune -af --filter "until=168h" || true

          echo "✅ Dev container updated (no public dev subdomain)."
          echo "   View via SSH port-forward (example):"
          echo "   ssh -p <VPS_PORT> -L 3001:127.0.0.1:3001 <VPS_USER>@<VPS_HOST>"
          EOF
