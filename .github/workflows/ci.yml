# Pull request checks. Read-only token, no deploy. The only secret is REGISTRY_DENYLIST, used by the
# privacy scan at the end of "PR checks" (env only, 0600 temp file, every term masked, never printed).
# The privacy scan fails closed: if the secret is missing (e.g. a fork PR, which never gets secrets) the
# job fails. Never run this workflow on pull_request_target.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: List changed files
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"

      - name: Tokens package lint
        working-directory: packages/tokens
        run: npm run lint

      - name: Tokens package build (generated files must be committed)
        working-directory: packages/tokens
        run: |
          npm run build
          git diff --exit-code -- demo/ header.html footer.html nav.js theme-init.js hashed/
          untracked=$(git status --porcelain --untracked-files=all -- . | grep '^??' || true)
          if [ -n "$untracked" ]; then echo "$untracked"; echo "::error::build created files that are not committed"; exit 1; fi

      - name: Tokens package tests (render, theme cookie, theme-init delivery, npm pack)
        working-directory: packages/tokens
        run: npm test

      - name: Tokens package tarball
        working-directory: packages/tokens
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tar -xzf "$RUNNER_TEMP/pack/"*.tgz -C "$RUNNER_TEMP/pack"

      - name: Secret scan of the tarball (gitleaks)
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "$GITLEAKS_URL"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --no-banner --redact "$RUNNER_TEMP/pack/package"

      - name: Token version check
        run: |
          v=$(node -p 'require("./packages/tokens/package.json").version')
          grep -q -- "--mm-tokens-version: \"$v\"" packages/tokens/tokens.css
          grep -q -- "^## $v" packages/tokens/CHANGELOG.md
          if grep -q '^packages/tokens/' "$RUNNER_TEMP/changed.txt" \
             && git cat-file -e "origin/${BASE_REF}:packages/tokens/package.json" 2>/dev/null; then
            base=$(git show "origin/${BASE_REF}:packages/tokens/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if [ "$base" = "$v" ]; then
              echo "packages/tokens changed but version is still $v; bump it and add a CHANGELOG entry"; exit 1
            fi
          fi
          echo "tokens version $v ok"

      - name: No target=_blank or window.open
        run: |
          status=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *.html|*.htm|*.js|*.mjs|*.jsx|*.ts|*.tsx|*.astro|*.md|*.mdx|*.svelte|*.vue) ;; *) continue ;; esac
            if grep -nEi "target[[:space:]]*=[[:space:]]*[\"'{]?[[:space:]]*[\"']?_blank|window\.open[[:space:]]*\(" "$f"; then
              echo "::error file=$f::new-tab link or window.open found"; status=1
            fi
          done < "$RUNNER_TEMP/changed.txt"
          exit $status

      - name: IP leak check (self-test)
        run: node --test packages/tokens/scripts/check-ips.test.mjs

      - name: IP leak check
        run: |
          mapfile -t files < <(while IFS= read -r f; do [ -f "$f" ] && echo "$f"; done < "$RUNNER_TEMP/changed.txt")
          node packages/tokens/scripts/check-ips.mjs packages/tokens "${files[@]}"

      - name: Links (lychee, offline)
        env:
          LYCHEE_URL: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tgz" "$LYCHEE_URL"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" --offline --no-progress --include-fragments \
            packages/tokens/demo/index.html 'packages/tokens/**/*.md'

      - name: Accessibility (axe, 360 px and 1280 px, light and dark)
        working-directory: .github/ci-tools/a11y
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome)" node run-axe.mjs ../../../packages/tokens

      - name: Theme (first paint, toggle, shared cookie across origins, JS off)
        working-directory: .github/ci-tools/a11y
        run: CHROME_PATH="$(command -v google-chrome)" node run-theme.mjs ../../../packages/tokens

      # Privacy scan. Required: it is part of this "PR checks" job. Fails closed.
      - name: Privacy scan (self-test, canaries only)
        run: node --test .github/ci-tools/privacy-scan/scan.test.mjs

      - name: Privacy scan (whole tree, tokens tarball, rendered nav)
        env:
          REGISTRY_DENYLIST: ${{ secrets.REGISTRY_DENYLIST }}
        run: |
          set +x
          umask 077
          if [ -z "${REGISTRY_DENYLIST//[[:space:],]/}" ]; then
            echo "DENYLIST NOT RUN – secret missing"
            exit 1
          fi
          printf '%s' "$REGISTRY_DENYLIST" > "$RUNNER_TEMP/denylist"
          unset REGISTRY_DENYLIST
          node .github/ci-tools/privacy-scan/mask.mjs "$RUNNER_TEMP/denylist"
          scan=.github/ci-tools/privacy-scan/scan.mjs
          node "$scan" --terms "$RUNNER_TEMP/denylist" --tree .
          node "$scan" --terms "$RUNNER_TEMP/denylist" --tarball "$(ls "$RUNNER_TEMP/pack/"*.tgz)" --profile tokens-tarball
          node "$scan" --terms "$RUNNER_TEMP/denylist" --dir packages/tokens/tests/snapshots --profile none

      - name: Privacy scan cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist"

  app:
    name: App build and tests (apps/moosematrix)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build (next build, CSP hashes, tokens sync, search index guard)
        run: npm -w moosematrix run build

      - name: Unit and built-page tests
        run: npm -w moosematrix test

