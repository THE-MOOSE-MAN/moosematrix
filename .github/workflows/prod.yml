name: Deploy MooseMatrix (Prod)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "packages/tokens/**"
      - ".github/ci-tools/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moosematrix
  SERVICE_NAME: moosematrix-app-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A newer push may cancel an older build...
    concurrency:
      group: moosematrix-prod-build
      cancel-in-progress: true
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set build year (UTC)
        shell: bash
        run: |
          set -euo pipefail
          echo "MOOSE_BUILD_YEAR=$(date -u +%Y)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name (lowercase)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:prod-latest
            ${{ steps.meta.outputs.image }}:prod-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          build-args: |
            MOOSE_BUILD_YEAR=${{ env.MOOSE_BUILD_YEAR }}
          provenance: false
          sbom: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # ...but never a running deploy: deploys queue (the VPS side also takes /run/lock/moose-deploy.lock).
    concurrency:
      group: moosematrix-prod-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/deploy-safe.sh
          sparse-checkout-cone-mode: false

      # Join the tailnet as an ephemeral tag:ci node (OAuth client limited to auth_keys + tag:ci).
      # Action pinned to a commit SHA; no Tailscale auth key is stored, only the OAuth client.
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.104.2
          use-cache: "true"

      - name: Install SSH key
        shell: bash
        # L10 (VB R39): secrets reach the script through env:, never as ${{ }} text inside it
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pin VPS host key (VPS_KNOWN_HOSTS secret)
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # The host key is pinned from a repo secret instead of trusting whatever ssh-keyscan returns on
          # each run (same pattern as moose_money / mooseman-site). Pre-merge step: add VPS_KNOWN_HOSTS.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts.in
          # Pin by KEY, not by host string: VPS_HOST may be an IP or a hostname, so ssh looks the key up
          # under the fixed alias moose-vps (-o HostKeyAlias=moose-vps below) and the host field of each
          # plain "<host> <type> <key>" line is rewritten to that alias. Hashed (|1|...) or @marker lines
          # are rejected; blank and comment lines are skipped (L9). See docs/deploy-safety.md.
          awk 'NF == 0 || $1 ~ /^#/ { next }
               $1 ~ /^(\||@)/ || NF < 3 { bad = 1; next }
               { print "moose-vps", $2, $3; n++ }
               END { exit (bad || n == 0) }' ~/.ssh/known_hosts.in > ~/.ssh/known_hosts \
            || { rm -f ~/.ssh/known_hosts ~/.ssh/known_hosts.in; echo "::error::VPS_KNOWN_HOSTS secret is missing, empty or not plain '<host> <type> <key>' lines; see docs/deploy-safety.md"; exit 1; }
          rm -f ~/.ssh/known_hosts.in
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy MooseMatrix Prod (compose-based)
        shell: bash
        env:   # L10: ssh target from env, not ${{ secrets.* }} text in the script
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_TS_HOST }}   # web server's tailnet address (Tailscale)
        run: |
          set -euo pipefail

          # scripts/deploy-safe.sh (rollback tag, verify, auto-rollback, deploy record) is streamed
          # ahead of the remote script over the same SSH session; nothing is installed on the VPS.
          { cat scripts/deploy-safe.sh; cat <<'EOF'
          set -euo pipefail
          # Whole body in main() and run with stdin from /dev/null: bash reads the entire stream before
          # anything runs, so no child process (docker compose run/exec) can swallow the rest (VB R39 H1).
          main() {
          ds_lock   # host-wide deploy lock: one deploy at a time on the VPS (VB R39 M1)

          SERVICE_NAME="moosematrix-app-prod"
          IMAGE_REPO="${{ needs.build-and-push.outputs.image }}"
          GHCR_USER="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"
          GHCR_TOKEN="${{ github.token }}"

          export DS_APP="moosematrix" DS_CONTAINER="$SERVICE_NAME" DS_SERVICE="$SERVICE_NAME"
          export DS_SHA="${{ github.sha }}" DS_RUN_ID="${{ github.run_id }}"

          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'ds_on_exit || true; rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null

          cd /home/moose/projects/infra

          echo "🏷️ Tagging the running image for rollback..."
          ds_pre

          echo "📥 Pulling latest prod image..."
          docker compose -f docker-compose.yml pull "$SERVICE_NAME"

          echo "🚀 Recreating container..."
          ds_up -d --force-recreate "$SERVICE_NAME"   # a failed up is logged; ds_finish decides + rolls back (VB N1)

          echo "🩺 Waiting for health + revision == ${DS_SHA:0:7} (auto-rollback on failure)..."
          ds_finish

          echo "🔎 Running container:"
          docker ps --filter "name=$SERVICE_NAME" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

          echo "🧹 Pruning dangling images only (keeps tagged and rollback-* images)..."
          ds_prune

          echo "✅ Prod deployment complete → https://moosematrix.com"
          }
          main </dev/null; exit $?
          EOF
          } | ssh -4 -T -o StrictHostKeyChecking=yes -o HostKeyAlias=moose-vps -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            "${VPS_USER}@${VPS_HOST}" bash -s
