name: Deploy Moosematrix (Prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ghcr.io/the-moose-man/moosematrix:prod-latest .
          docker push ghcr.io/the-moose-man/moosematrix:prod-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Join the tailnet as an ephemeral tag:ci node (OAuth client limited to auth_keys + tag:ci).
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.104.2
          use-cache: "true"

      - name: Pin VPS host key (VPS_KNOWN_HOSTS secret)
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Host key pinned from the secret (same pattern as the main-branch workflows); ssh looks it up
          # under the fixed alias moose-vps (-o HostKeyAlias=moose-vps) with strict checking.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts.in
          awk 'NF == 0 || $1 ~ /^#/ { next }
               $1 ~ /^(\||@)/ || NF < 3 { bad = 1; next }
               { print "moose-vps", $2, $3; n++ }
               END { exit (bad || n == 0) }' ~/.ssh/known_hosts.in > ~/.ssh/known_hosts \
            || { rm -f ~/.ssh/known_hosts ~/.ssh/known_hosts.in; echo "::error::VPS_KNOWN_HOSTS secret is missing, empty or malformed"; exit 1; }
          rm -f ~/.ssh/known_hosts.in

      - name: Install private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy Moosematrix Prod
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes -o HostKeyAlias=moose-vps \
              -p "${{ secrets.VPS_PORT }}" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_TS_HOST }}" <<EOF
            set -e
            cd /projects/infra

            echo "📥 Pulling latest prod image..."
            docker compose -f docker-compose.yml pull moosematrix-app-prod
            docker compose -f docker-compose.yml up -d moosematrix-app-prod

            echo "🧹 Pruning old images (keep last 5)..."
            docker images "ghcr.io/the-moose-man/moosematrix" --format "{{.Repository}}:{{.Tag}}" \
              | grep -v latest | sort -r \
              | tail -n +6 | xargs -r docker rmi || true

            echo "✅ Prod deployment complete → https://moosematrix.com"
          EOF
